<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    form{
        width : 300px;
        background-color: lightpink;
        border : 20px solid beige;
        margin : 30px auto;
    }
</style>




</head>
<body>
    <form action="/register" method="post">
        <label for="fullName">Name: </label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter name...">
        <br>
        <label for="email"> Email: </label>
        <input type="email" id="email" name="email" placeholder=" Enter email...">

        <br>
        <label name="gender"> Gender: </label>

        <input type="radio" value="male" id="male">
        <label for="male">Male</label>

        <input type="radio" value="female" id="female">
        <label for="female">Female</label>
        <br>

        <label for="date">Date: </label>
        <input type="date">

        <label for="file"> Upload file: </label>
        <input type="file" id="file" name="file">
<br>
        <label for="branch"> Branch: </label>
        <select name="branch" id="branch">
        <option value="cse">CSE </option>
        <option value="ec">EC </option>
        <option value="it">IT </option>
       </select>
       <br>

       <label> Select Skills: </label>
       <br>
       <input type="checkbox" id="java ">
       <label for="java">java </label>

       <input type="checkbox" id=" javascript">
       <label for="javascript">javascript </label>
       <br>
       <button type="submit"> Submit</button>








    </form>
    <br>

    <br>
<iframe width="560" height="315" src="https://www.youtube.com/embed/OXGznpKZ_sA?si=9B7bzRURwc-N1xjk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>



</body>
</html>
