<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Movies</title>
    <link rel="stylesheet" href="./district-website-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">


</head>

<body>

    <header class="navbar">

      <div class="logo">
    <img src="https://b.zmtcdn.com/data/edition_assets/17466982242413.svg" alt="Logo">
</div>

        <div class="location">
            <span></span>
            <div>
                <strong>Gurugram</strong>
                <small>Haryana</small>
            </div>
        </div>

        <nav>
            <a class="active" href="#">For You</a>
            <a href="#">Dining</a>
            <a href="#">Movies</a>
            <a href="#">Events</a>
            <a href="#">Comedy</a>
            <a href="#">Stores</a>
            <a href="#">Activities</a>
            <a href="#">Play</a>
        </nav>

        <div class="booking">✓ Booking Confirmed!</div>

    </header>

    <main>

        <div class="card-container">

            <div class="movie-card">
                <div class="movie-image">
                    <img src="https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg" alt="Hanuman Ansh">
                </div>
                <div class="movie-info">
                    <h5>Hanuman Ansh</h5>
                    <span>⭐ 9.0 | U | Hindi</span>
                
                </div>
                <button type="button" class="btn btn-primary">Book now</button>
            </div>

            <div class="movie-card">
                <div class="movie-image">
                    <img src="https://cdn.district.in/movies-assets/images/cinema/toxiv%3Dc-8340c900-9c6f-11f1-97d4-73a32236137e.jpg" alt="Toxic">
                </div>
                <div class="movie-info">
                    <h5>Toxic: A Fairy Tale for Grown-ups</h5>
                    <span>⭐ 8.5 | A | Hindi + 1 more</span>
                    <button>Book Now</button>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-image">
                    <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg" alt="Mirzapur">
                </div>
                <div class="movie-info">
                    <h5>Mirzapur: The Movie</h5>
                    <span>⭐ 8.5 | A | Hindi</span>
                    <button>Book Now</button>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-image">
                    <img src="https://cdn.district.in/movies-assets/images/cinema/AW_Poster-18591030-9548-11f1-b29d-8985d3d6c644.jpg" alt="Awarapan 2">
                </div>
                <div class="movie-info">
                    <h5>Awarapan 2</h5>
                    <span>⭐ 8.5 | UA16+ | Hindi</span>
                    <button>Book Now</button>
                </div>
            </div>

        </div>

       <!-- <button class="book-btn">
        Book now
       </button> -->
         

    </main>

</body>
</html>
