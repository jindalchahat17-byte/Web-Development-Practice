    <h2> Student Registration Portal</h2>
    <form class="form-container" action="/register" method="post">
        <label for="fullName"><strong>Full Name: </strong></label>
        
        <br>
        <input type="text" id="fullName" name="fullName" placeholder="Enter name...">
        <br>
        <label for="University email"> <strong>University Email:</strong> </label>
        <br>

        <label for="date"><strong> Date: </strong> </label>
        <br>
        <input type="date">


        <label name="gender"> <strong>Gender: </strong></label>
        
        <input type="radio" value="male" id="male">

        <input type="radio" value="female" id="female">
        <label for="female">Female</label>
        <br>

        <label for="branch"> <strong> Branch: </strong></label>
        <br>
        <select name="branch" id="branch">

        <option value="ec">EC </option>

       </select>
       <br>

       <button type="reset"> Reset</button>
