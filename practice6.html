<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container {
            align-items: center;
            justify-content: center;
        }

        .loader {
            height: 80px;
            width: 80px;
            border: 5px solid #ddd;
            border-radius: 50%;
            border-top-color: blue;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            from {
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="loader"></div>
    </div>

</body>
</html>
